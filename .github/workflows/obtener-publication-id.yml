
name: Obtener ID Tienda Online

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Consultar publicaciones de Shopify
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          shop = os.environ["SHOPIFY_SHOP"].strip()
          shop = shop.removeprefix("https://").rstrip("/")

          data = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": os.environ["SHOPIFY_CLIENT_ID"],
              "client_secret": os.environ["SHOPIFY_CLIENT_SECRET"]
          }).encode()

          req = urllib.request.Request(
              f"https://{shop}/admin/oauth/access_token",
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              token = json.load(r)["access_token"]

          query = """
          query {
            publications(first: 50) {
              nodes {
                id
                name
              }
            }
          }
          """

          req = urllib.request.Request(
              f"https://{shop}/admin/api/2026-10/graphql.json",
              data=json.dumps({"query": query}).encode(),
              headers={
                  "X-Shopify-Access-Token": token,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.load(r)

          if result.get("errors"):
              raise RuntimeError(
                  "Error GraphQL: " + str(result["errors"])
              )

          publications = result["data"]["publications"]["nodes"]

          print("PUBLICACIONES ENCONTRADAS:")
          for pub in publications:
              print(pub["name"], "=", pub["id"])
          PY
